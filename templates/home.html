<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Manutenções</title>
  <!-- Link do Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <!-- Cartão Principal -->
        <div class="card shadow border-0 rounded-4 p-4 text-center">
          
          <!-- Nome do Aplicativo -->
          <h1 class="h3 fw-bold text-primary mb-2">Controle de Manutenções</h1>
          <p class="text-muted mb-4 fs-6">Consulte o histórico e pendências do seu veículo</p>

          <!-- Formulário de Consulta da Placa -->
          <!-- O 'action' aponta para a rota do seu back-end que fará a busca -->
          <form action="/buscar" method="POST">
            
            <div class="mb-3">
              <label for="placa" class="form-label fw-semibold text-secondary">Digite a Placa do Veículo</label>
              <input 
                type="text" 
                id="placa"
                name="placa" 
                class="form-control form-control-lg text-center text-uppercase fw-bold border-2" 
                placeholder="ABC-1234 ou ABC1D23"
                maxlength="8"
                required
              >
            </div>

            <!-- Botão de Ação -->
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
              Consultar Placa
            </button>

          </form>
          {% if veiculo_nao_encontrado %}
            <div class="alert alert-warning alert-dismissible fade show shadow-sm my-3" role="alert">
                <h5 class="alert-heading fw-bold mb-2">Veículo não encontrado!</h5>
                <p class="mb-3">
                    O veículo com a placa <strong>{{ placa }}</strong> não foi localizado no sistema. Deseja cadastrá-lo agora?
                </p>
                <hr>
                <div class="d-flex justify-content-center gap-2">
                  <!-- Botão "Não": apenas fecha o alerta no HTML/Bootstrap -->
                  <form action="/" method="GET" class="d-inline">
                  <button type="submit" class="btn btn-outline-secondary btn-sm">
                  Não
                  </button>
                  </form>
                    <!-- Botão "Sim": envia um POST direto para a rota de cadastro -->
                  <form action="/cadastrar_veiculo" method="POST" class="d-inline">
                    <input type="hidden" name="placa" value="{{ placa }}">
                    <button type="submit" class="btn btn-success btn-sm fw-bold">
                        Sim, incluir veículo
                    </button>
                  </form>
                </div>
            </div>
          {% endif %}


        </div>

        <!-- Rodapé simples -->
        <p class="text-center text-muted mt-4 small">
          &copy; 2026 Controle de Manutenções. Todos os direitos reservados.
        </p>

      </div>
    </div>
  </div>

</body>
</html>
